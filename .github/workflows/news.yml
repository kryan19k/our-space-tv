name: Refresh news
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:
    paths: ['news-topics.json', 'scripts/fetch-news.mjs']
permissions:
  contents: write
jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fetch-news.mjs
      - name: Commit if changed
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add news.json
          git diff --cached --quiet || (git commit -m "Refresh news" && git pull --rebase -q && git push)
